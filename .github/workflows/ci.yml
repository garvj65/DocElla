name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply PR2 Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr2-multiformat-ingestion

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply project formatting
        run: |
          npm ci
          npm run format
          git add .env.example apps/backend/src/config/environment.ts apps/backend/src/document-layout apps/backend/src/errors/error-codes.ts apps/backend/src/middleware/document-upload.ts apps/backend/test/azure-document-layout-provider.test.ts apps/backend/test/document-format.test.ts apps/backend/test/document-intelligence-environment.test.ts apps/backend/test/document-layout-service.test.ts apps/backend/test/document-upload.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format multi-format ingestion"
          git push origin HEAD:agent/pr2-multiformat-ingestion
