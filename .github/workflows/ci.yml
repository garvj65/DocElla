name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Document Preview
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr4-enterprise-review-workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact formatting
        run: |
          npm ci
          npx prettier apps/frontend/src/features/generic-extraction/document-preview.tsx --write
          git add apps/frontend/src/features/generic-extraction/document-preview.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format document preview"
          git push origin HEAD:agent/pr4-enterprise-review-workspace
