name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-fix:
    name: Apply PR3 Lint Corrections
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr3-arbitrary-document-extraction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply focused corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          grounding = Path("apps/backend/src/generic-extraction/generic-grounding-service.ts")
          text = grounding.read_text()
          text = text.replace(
              'import type {\n  GenericGroundingRequest,\n  GenericGroundingService,\n} from "./generic-extraction-types.js";',
              'import type { GenericGroundingService } from "./generic-extraction-types.js";',
          )
          text = text.replace(
              'const reviewValue = (\n',
              'const isScalarArray = (\n  value: GenericFieldValue,\n): value is readonly GenericScalarValue[] => Array.isArray(value);\n\nconst reviewValue = (\n',
          )
          text = text.replace(
              '  const values = Array.isArray(value) ? value : [value];',
              '  const values = isScalarArray(value) ? value : [value];',
          )
          text = text.replace(
              '''    return {
      confidence: lowOcr ? CONFIDENCE.lowOcr : CONFIDENCE.verified,
      evidence: anchors,
      message: lowOcr ? "The source evidence has low OCR confidence." : undefined,
      status: lowOcr ? "low_ocr_confidence" : "verified",
    };''',
              '''    const review = {
      confidence: lowOcr ? CONFIDENCE.lowOcr : CONFIDENCE.verified,
      evidence: anchors,
      status: lowOcr ? ("low_ocr_confidence" as const) : ("verified" as const),
    };
    return lowOcr
      ? { ...review, message: "The source evidence has low OCR confidence." }
      : review;''',
          )
          text = text.replace(
              '''    return {
      confidence: lowOcr ? CONFIDENCE.lowOcr : CONFIDENCE.verified,
      evidence: anchors,
      message: lowOcr ? "Some table evidence has low OCR confidence." : undefined,
      rowCount: rows.length,
      status: lowOcr ? "low_ocr_confidence" : "verified",
    };''',
              '''    const review = {
      confidence: lowOcr ? CONFIDENCE.lowOcr : CONFIDENCE.verified,
      evidence: anchors,
      rowCount: rows.length,
      status: lowOcr ? ("low_ocr_confidence" as const) : ("verified" as const),
    };
    return lowOcr
      ? { ...review, message: "Some table evidence has low OCR confidence." }
      : review;''',
          )
          grounding.write_text(text)

          test_file = Path("apps/backend/test/generic-grounding-service.test.ts")
          text = test_file.read_text()
          text = text.replace(
              '  it("uses low OCR confidence instead of verified when evidence is uncertain", () => {\n    const lowConfidenceLayout:',
              '  it("uses low OCR confidence instead of verified when evidence is uncertain", () => {\n    const sourceTable = layout.tables[0];\n    if (sourceTable === undefined) throw new Error("Expected a layout table fixture.");\n    const lowConfidenceLayout:',
          )
          text = text.replace('          ...layout.tables[0]!,', '          ...sourceTable,')
          text = text.replace(
              '          cells: layout.tables[0]!.cells.map((cell) => ({ ...cell, confidence: 0.3 })),',
              '          cells: sourceTable.cells.map((cell) => ({ ...cell, confidence: 0.3 })),',
          )
          test_file.write_text(text)
          PY
          npm ci
          npm run format
          npm run build -w @docella/schemas
          npx eslint apps/backend/src/generic-extraction/generic-grounding-service.ts apps/backend/test/generic-grounding-service.test.ts
          git add apps/backend/src/generic-extraction/generic-grounding-service.ts apps/backend/test/generic-grounding-service.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: resolve generic grounding lint findings"
          git push origin HEAD:agent/pr3-arbitrary-document-extraction
