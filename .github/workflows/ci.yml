name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Apply Adaptive Discovery Fallback
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/generic-real-document-batching

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch generic discovery fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/backend/src/generic-extraction/generic-groq-extractor.ts")
          text = path.read_text()
          text = text.replace(
              'import { mapProviderError, type GroqChatClient } from "../extraction/groq-structured-extractor.js";',
              'import {\n  mapProviderError,\n  type GroqChatClient,\n  type GroqCompletionCreateRequest,\n} from "../extraction/groq-structured-extractor.js";',
          )
          text = text.replace('      readonly strict: true;', '      readonly strict: boolean;')
          text = text.replace(
              '  readonly stage: "discovery" | "extraction";\n  readonly system: string;',
              '  readonly stage: "discovery" | "extraction";\n  readonly strict?: boolean;\n  readonly system: string;',
          )
          text = text.replace(
              '  user: string,\n): GenericCompletionRequest => ({',
              '  user: string,\n  strict: boolean,\n): GenericCompletionRequest => ({',
          )
          text = text.replace('      strict: true,', '      strict,')
          text = text.replace(
              '    const completion = await client.chat.completions.create(request, requestOptions(signal));',
              '    const completion = await client.chat.completions.create(\n      request as unknown as GroqCompletionCreateRequest,\n      requestOptions(signal),\n    );',
          )
          text = text.replace(
              '  stage,\n  system,\n  userMessage,\n}: CompleteWithBackoffOptions): Promise<string | null | undefined> => {',
              '  stage,\n  strict = true,\n  system,\n  userMessage,\n}: CompleteWithBackoffOptions): Promise<string | null | undefined> => {',
          )
          text = text.replace(
              '        buildRequest(environment, schemaName, schema, system, userMessage(sampledContent)),',
              '        buildRequest(\n          environment,\n          schemaName,\n          schema,\n          system,\n          userMessage(sampledContent),\n          strict,\n        ),',
          )
          text = text.replace(
              'const isProviderPayloadTooLarge = (error: unknown): error is AppError =>\n  error instanceof AppError && error.safeLogContext?.providerHttpStatus === 413;',
              'const isProviderPayloadTooLarge = (error: unknown): error is AppError =>\n  error instanceof AppError && error.safeLogContext?.providerHttpStatus === 413;\n\nconst isProviderBadRequest = (error: unknown): error is AppError =>\n  error instanceof AppError && error.safeLogContext?.providerHttpStatus === 400;',
          )

          old = '''  schemaDiscoverer: {\n    discover: async ({ layout, signal }): Promise<DiscoveredDocumentSchema> => {\n      for (const attempt of [0, 1] as const) {\n        const response = await completeWithPayloadBackoff({\n          client,\n          content: layout.content,\n          environment,\n          logger,\n          schema: buildGenericDiscoveryJsonSchema(),\n          schemaName: "generic_schema_discovery_v1",\n          signal,\n          stage: "discovery",\n          system: buildGenericDiscoverySystemInstruction(),\n          userMessage: (content) =>\n            buildGenericDiscoveryUserMessage(layout, content, attempt === 1),\n        });\n        try {\n          return parseContent(\n            response,\n            discoveredDocumentSchemaSchema,\n            ERROR_CODES.GENERIC_SCHEMA_DISCOVERY_INVALID,\n            "discovery",\n            normalizeProviderDiscoveryResult,\n          );\n        } catch (error) {\n          if (attempt === 0 && error instanceof AppError) {\n            warnRetry(logger, environment, "discovery");\n            throwIfAborted(signal);\n            continue;\n          }\n          throw error;\n        }\n      }\n      throw invalidOutput(ERROR_CODES.GENERIC_SCHEMA_DISCOVERY_INVALID, "discovery");\n    },\n  },'''
          new = '''  schemaDiscoverer: {\n    discover: async ({ layout, signal }): Promise<DiscoveredDocumentSchema> => {\n      let useBestEffortDiscovery = false;\n\n      for (const attempt of [0, 1] as const) {\n        const completeDiscovery = (strict: boolean): Promise<string | null | undefined> =>\n          completeWithPayloadBackoff({\n            client,\n            content: layout.content,\n            environment,\n            logger,\n            schema: buildGenericDiscoveryJsonSchema(),\n            schemaName: "generic_schema_discovery_v1",\n            signal,\n            stage: "discovery",\n            strict,\n            system: buildGenericDiscoverySystemInstruction(),\n            userMessage: (content) =>\n              buildGenericDiscoveryUserMessage(layout, content, attempt === 1),\n          });\n\n        let response: string | null | undefined;\n        try {\n          response = await completeDiscovery(!useBestEffortDiscovery);\n        } catch (error) {\n          if (!useBestEffortDiscovery && isProviderBadRequest(error)) {\n            useBestEffortDiscovery = true;\n            logger.warn(\n              {\n                event: "generic_discovery_strict_fallback",\n                genericExtractionStage: "discovery",\n                providerHttpStatus: 400,\n                providerModel: environment.groqModel,\n              },\n              "Generic discovery strict mode was rejected; retrying with best-effort structured output",\n            );\n            response = await completeDiscovery(false);\n          } else {\n            throw error;\n          }\n        }\n\n        try {\n          return parseContent(\n            response,\n            discoveredDocumentSchemaSchema,\n            ERROR_CODES.GENERIC_SCHEMA_DISCOVERY_INVALID,\n            "discovery",\n            normalizeProviderDiscoveryResult,\n          );\n        } catch (error) {\n          if (attempt === 0 && error instanceof AppError) {\n            warnRetry(logger, environment, "discovery");\n            throwIfAborted(signal);\n            continue;\n          }\n          throw error;\n        }\n      }\n      throw invalidOutput(ERROR_CODES.GENERIC_SCHEMA_DISCOVERY_INVALID, "discovery");\n    },\n  },'''
          if old not in text:
              raise SystemExit("Could not locate schemaDiscoverer block")
          text = text.replace(old, new)
          path.write_text(text)

          test_path = Path("apps/backend/test/generic-groq-extractor.test.ts")
          test = test_path.read_text()
          test = test.replace(
              'const createClient = (contents: readonly string[], captured: CapturedRequest[]): GroqChatClient => {',
              'const createClient = (\n  contents: readonly (string | Error)[],\n  captured: CapturedRequest[],\n): GroqChatClient => {',
          )
          test = test.replace(
              '          const content = contents[index];\n          index += 1;\n          return { choices: [{ message: { content } }] };',
              '          const content = contents[index];\n          index += 1;\n          if (content instanceof Error) throw content;\n          return { choices: [{ message: { content } }] };',
          )
          marker = '  it("retries each pass once when local validation rejects provider output", async () => {'
          addition = '''  it("falls back to best-effort discovery after a provider 400 and still validates locally", async () => {\n    const captured: CapturedRequest[] = [];\n    const providerBadRequest = Object.assign(new Error("provider rejected strict discovery"), {\n      status: 400,\n    });\n    const extractors = createGenericGroqExtractors({\n      client: createClient([providerBadRequest, JSON.stringify(providerDiscoveredSchema)], captured),\n      environment,\n      logger,\n    });\n\n    await expect(extractors.schemaDiscoverer.discover({ layout })).resolves.toEqual(discoveredSchema);\n    expect(captured).toHaveLength(2);\n    expect(captured[0]?.response_format.json_schema.strict).toBe(true);\n    expect(captured[1]?.response_format.json_schema.strict).toBe(false);\n  });\n\n'''
          if marker not in test:
              raise SystemExit("Could not locate test insertion marker")
          test = test.replace(marker, addition + marker)
          test_path.write_text(test)
          PY
          npm ci
          npm run format
          npm run build -w @docella/schemas
          npm run lint
          npm run typecheck
          npm test -w @docella/backend -- --run generic-groq-extractor.test.ts
          git add apps/backend/src/generic-extraction/generic-groq-extractor.ts apps/backend/test/generic-groq-extractor.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: fall back for strict generic discovery rejection"
          git push origin HEAD:fix/generic-real-document-batching
