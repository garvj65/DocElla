name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Extraction Provider Schema Fix
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/extraction-provider-schema-compatibility

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact formatting
        run: |
          npm ci
          npx prettier packages/schemas/src/builders/build-generic-json-schema.ts --write
          git add packages/schemas/src/builders/build-generic-json-schema.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format extraction provider schema fix"
          git push origin HEAD:fix/extraction-provider-schema-compatibility
