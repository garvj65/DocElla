name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Generic Provider Payload Fix
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/generic-provider-payload-budget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply project formatting
        run: |
          npm ci
          npx prettier apps/backend/src/generic-extraction/generic-extraction-service.ts apps/backend/src/generic-extraction/generic-groq-extractor.ts apps/backend/src/generic-extraction/generic-provider-budget.ts apps/backend/test/generic-provider-payload-backoff.test.ts --write
          git add apps/backend/src/generic-extraction/generic-extraction-service.ts apps/backend/src/generic-extraction/generic-groq-extractor.ts apps/backend/src/generic-extraction/generic-provider-budget.ts apps/backend/test/generic-provider-payload-backoff.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format generic provider payload fix"
          git push origin HEAD:fix/generic-provider-payload-budget
