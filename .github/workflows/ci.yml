name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-diff:
    name: Print Generic Grounding Formatter Patch
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Print exact formatter patch
        run: |
          npm ci
          npx prettier apps/backend/src/generic-extraction/generic-grounding-service.ts --write
          git diff -- apps/backend/src/generic-extraction/generic-grounding-service.ts
          exit 1
