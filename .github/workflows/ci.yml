name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Safe Provider Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/generic-real-document-batching

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact project formatting
        run: |
          npm ci
          npx prettier apps/backend/src/extraction/groq-structured-extractor.ts apps/backend/test/provider-error-diagnostics.test.ts --write
          git add apps/backend/src/extraction/groq-structured-extractor.ts apps/backend/test/provider-error-diagnostics.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format safe provider diagnostics"
          git push origin HEAD:fix/generic-real-document-batching
