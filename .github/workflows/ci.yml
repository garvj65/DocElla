name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: PR3 Test Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared schemas
        run: npm run build -w @docella/schemas

      - name: Run shared generic schema tests
        run: npm test -w @docella/schemas -- --reporter=verbose generic-json-schema.test.ts generic-document-contracts.test.ts

      - name: Run backend generic extraction tests
        run: npm test -w @docella/backend -- --reporter=verbose generic-groq-extractor.test.ts generic-grounding-service.test.ts generic-extraction-service.test.ts extract-generic-route.test.ts
