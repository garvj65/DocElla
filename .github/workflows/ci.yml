name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-fix:
    name: Apply PR2 Lint Fixes
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr2-multiformat-ingestion

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply safe lint fixes
        run: |
          npm ci
          npm run build -w @docella/schemas
          npx eslint . --fix || true
          npm run format
          git add apps/backend/src/document-layout apps/backend/test
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: apply multi-format ingestion lint fixes"
          git push origin HEAD:agent/pr2-multiformat-ingestion
